<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status WA HD Max</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--red:#e11d38;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px 16px;font:16px/1.45 Poppins,system-ui,sans-serif;color:#f4f6ff;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27240%27%20height%3D%27240%27%20fill%3D%27none%27%20stroke-width%3D%272.5%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cg%20stroke%3D%27rgb%28255%2C77%2C94%29%27%20opacity%3D%27.28%27%3E%3Cpath%20d%3D%27M34%2062V28l30-7v34%27/%3E%3Ccircle%20cx%3D%2727%27%20cy%3D%2762%27%20r%3D%277%27/%3E%3Ccircle%20cx%3D%2757%27%20cy%3D%2755%27%20r%3D%277%27/%3E%3Ccircle%20cx%3D%27180%27%20cy%3D%27168%27%20r%3D%2726%27/%3E%3Ccircle%20cx%3D%27180%27%20cy%3D%27168%27%20r%3D%277%27/%3E%3Cpath%20d%3D%27M112%20200v-14M122%20206v-26M132%20196v-8M142%20210v-34%27/%3E%3C/g%3E%3Cg%20stroke%3D%27rgb%28190%2C205%2C255%29%27%20opacity%3D%27.17%27%3E%3Cpath%20d%3D%27M150%2066v-8a26%2026%200%200%201%2052%200v8%27/%3E%3Crect%20x%3D%27145%27%20y%3D%2762%27%20width%3D%2712%27%20height%3D%2720%27%20rx%3D%275%27/%3E%3Crect%20x%3D%27195%27%20y%3D%2762%27%20width%3D%2712%27%20height%3D%2720%27%20rx%3D%275%27/%3E%3Cpath%20d%3D%27M52%20178v-40c8%204%2015%2010%2014%2020%27/%3E%3Cellipse%20cx%3D%2744%27%20cy%3D%27179%27%20rx%3D%278%27%20ry%3D%276%27/%3E%3Cpath%20d%3D%27M104%20100l24%2015-24%2015z%27/%3E%3C/g%3E%3C/svg%3E"),radial-gradient(circle at 90% 0,rgba(225,29,56,.45),transparent 55%),linear-gradient(160deg,#0b1437,#060a1f);background-attachment:fixed}
main{max-width:460px;margin:auto;padding:22px 18px;border:1px solid var(--line);border-radius:24px;background:rgba(12,20,52,.86);box-shadow:0 20px 50px rgba(0,0,0,.5)}
h1{margin:0;font-size:1.6rem;text-align:center;letter-spacing:.5px}
h1 span{color:#ff4d5e}
.sub{text-align:center;color:#aab4d8;font-size:.86rem}
input,select,button,progress,video,#save{width:100%;font:inherit;margin-top:14px}
input,select{padding:12px;color:inherit;background:#101a45;border:1px solid var(--line);border-radius:14px}
input{border:2px dashed rgba(255,77,94,.65)}
input::file-selector-button{font:600 .9rem Poppins,system-ui,sans-serif;color:#fff;background:var(--red);border:0;border-radius:10px;padding:9px 14px;margin-right:10px}
button,#save{display:block;padding:15px;border:0;border-radius:999px;color:#fff;font-weight:600;text-align:center;text-decoration:none;background:linear-gradient(135deg,#ff3b55,#a80f2a);box-shadow:0 8px 22px rgba(225,29,56,.45);transition:transform .15s}
button:active,#save:active{transform:scale(.97)}
button:disabled{opacity:.45;box-shadow:none}
#save{background:linear-gradient(135deg,#2b49b8,#17276b);border:1px solid #ff4d5e}
progress{height:10px;accent-color:var(--red)}
#msg{text-align:center;color:#cfd7f5}
video{max-height:55vh;background:#000;border-radius:16px}
[hidden]{display:none!important}
label{display:block;margin-top:14px;font-size:.86rem;color:#aab4d8}
label input{margin-top:6px}
.dual{position:relative;height:56px;margin-top:6px;border-radius:12px;background:#101a45;border:1px solid var(--line)}
#fill{position:absolute;top:0;bottom:0;background:rgba(225,29,56,.4);border-block:3px solid #ff4d5e}
.dual input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;background:none;appearance:none;-webkit-appearance:none;pointer-events:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:54px;border-radius:8px;border:2px solid #fff;background:#e11d38;pointer-events:auto}
.dual input::-moz-range-thumb{width:18px;height:50px;border-radius:8px;border:2px solid #fff;background:#e11d38;pointer-events:auto}
#range{text-align:center;margin:8px 0 0}
#mstart{height:44px;padding:0;border:0;background:none;accent-color:var(--red)}
#mtime{text-align:center;margin:10px 0 0}
</style>
</head>
<body>
<main>
<h1>🎵 Status WA <span>HD Max</span></h1>
<p class="sub">Encoder x264, 2 kali proses. Lebih lambat. Biarkan layar menyala dan jangan pindah aplikasi.</p>
<input id="file" type="file" accept="video/*">
<select id="res" aria-label="Resolusi">
<option value="720">HD 720 (disarankan)</option>
<option value="1080">Resolusi asli (maks. 1080)</option>
<option value="screen" id="scr">Sesuai layar HP</option>
</select>
<select id="preset" aria-label="Mutu">
<option value="medium">Bagus (lebih cepat)</option>
<option value="slow">Maksimal (jauh lebih lama)</option>
</select>
<div id="trim" hidden>
<video id="cut" playsinline preload="auto"></video>
<p id="range"></p>
<div class="dual"><div id="fill"></div>
<input id="start" type="range" min="0" step="0.1" value="0" aria-label="Awal potongan">
<input id="end" type="range" min="0" step="0.1" value="0" aria-label="Akhir potongan"></div>
<button id="play" type="button">▶ Putar potongan</button>
</div>
<label>🎶 Tambah lagu (opsional)<input id="music" type="file" accept="audio/*"></label>
<div id="song" hidden>
<p id="mtime"></p>
<input id="mstart" type="range" min="0" step="0.1" value="0" aria-label="Awal lagu">
<button id="mplay" type="button">▶ Dengarkan</button>
<audio id="aud" preload="auto"></audio>
</div>
<select id="amode" aria-label="Suara">
<option value="ganti">Ganti suara asli dengan lagu</option>
<option value="campur">Campur lagu + suara asli</option>
</select>
<select id="speed" aria-label="Kecepatan"><option value="0.1">Kecepatan 0,1x</option><option value="0.2">Kecepatan 0,2x</option><option value="0.25">Kecepatan 0,25x</option><option value="0.5">Kecepatan 0,5x</option><option value="0.75">Kecepatan 0,75x</option><option value="1" selected>Kecepatan 1x (normal)</option><option value="1.25">Kecepatan 1,25x</option><option value="1.5">Kecepatan 1,5x</option><option value="2">Kecepatan 2x</option><option value="3">Kecepatan 3x</option><option value="4">Kecepatan 4x</option><option value="5">Kecepatan 5x</option><option value="10">Kecepatan 10x</option></select>
<select id="smooth" aria-label="Gerak lambat">
<option value="none">Slow motion biasa (cepat)</option>
<option value="blend">Slow motion halus: blend (lama)</option>
<option value="mci">Slow motion halus: gerak (sangat lama)</option>
</select>
<button id="go" disabled>Proses video</button>
<progress id="bar" max="1" value="0" hidden></progress>
<p id="msg" role="status"></p>
<video id="prev" controls playsinline hidden></video>
<a id="save" hidden>Simpan video</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id), TARGET=9.2e6, MAX=9.8e6;
const LIB='https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/';
const CORE='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/';
const dpr=window.devicePixelRatio||1;
const sides=[Math.round(screen.width*dpr),Math.round(screen.height*dpr)].sort((a,b)=>a-b);
$('scr').textContent=`Sesuai layar HP (${sides[0]}×${sides[1]})`;
let file,meta,ff,outUrl,label='',outDur=1;
const say=t=>$('msg').textContent=t;

function check(){
  if(!meta)return;
  const a=+$('start').value,b=+$('end').value,out=(b-a)/$('speed').value;
  const ok=a>=0&&b<=meta.d+0.1&&out>0.5&&out<=90.5;
  $('go').disabled=!ok;
  say(`${meta.w}×${meta.h} · asli ${meta.d.toFixed(1)} detik → hasil ${out.toFixed(1)} detik${ok?'':' (cek waktu potong; hasil harus 0,5–90 detik)'}`);
}
$('speed').onchange=check;
const cut=$('cut');
function gambar(){
  const a=+$('start').value,b=+$('end').value,d=meta.d;
  $('fill').style.left=a/d*100+'%';$('fill').style.width=Math.max(0,b-a)/d*100+'%';
  $('range').textContent=`✂️ ${a.toFixed(1)} s  —  ${b.toFixed(1)} s`;
}
function geser(e){
  if(!meta)return;
  const awal=e.target.id==='start';let a=+$('start').value,b=+$('end').value;
  if(b-a<0.6){if(awal)a=Math.max(0,b-0.6);else b=Math.min(meta.d,a+0.6);$('start').value=a;$('end').value=b}
  cut.pause();cut.currentTime=+e.target.value;gambar();check();
}
$('start').oninput=$('end').oninput=geser;
$('play').onclick=()=>{
  if(!cut.paused)return cut.pause();
  const a=+$('start').value;
  if(cut.currentTime<a||cut.currentTime>=+$('end').value-0.1)cut.currentTime=a;
  cut.play();
};
cut.ontimeupdate=()=>{if(!cut.paused&&cut.currentTime>=+$('end').value)cut.pause()};
cut.onplay=()=>$('play').textContent='⏸ Jeda';
cut.onpause=()=>$('play').textContent='▶ Putar potongan';
let cutUrl,songUrl;
const aud=$('aud'),jam=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const panjang=()=>meta?(+$('end').value-+$('start').value)/$('speed').value:30;
const label_lagu=()=>$('mtime').textContent=`🎶 Lagu mulai di ${jam(+$('mstart').value)} dari ${jam(aud.duration||0)}`;
function putar(){aud.currentTime=+$('mstart').value;aud.play().catch(()=>{})}
$('music').onchange=e=>{
  aud.pause();$('song').hidden=true;$('mstart').value=0;
  if(songUrl)URL.revokeObjectURL(songUrl);
  const f=e.target.files[0];if(!f)return;
  aud.src=songUrl=URL.createObjectURL(f);
};
aud.onloadedmetadata=()=>{
  if(!isFinite(aud.duration))return;
  $('mstart').max=Math.max(0,aud.duration-1).toFixed(1);$('mstart').value=0;$('song').hidden=false;label_lagu();
};
$('mstart').oninput=()=>{aud.pause();label_lagu()};
$('mstart').onchange=putar;
$('mplay').onclick=()=>aud.paused?putar():aud.pause();
aud.ontimeupdate=()=>{if(aud.currentTime>=+$('mstart').value+panjang())aud.pause()};
aud.onplay=()=>$('mplay').textContent='⏸ Berhenti';
aud.onpause=()=>$('mplay').textContent='▶ Dengarkan';

$('file').onchange=e=>{
  file=e.target.files[0];meta=null;$('go').disabled=true;$('trim').hidden=true;cut.pause();
  if(!file)return;
  const v=document.createElement('video'),u=URL.createObjectURL(file);
  v.preload='metadata';
  v.onloadedmetadata=()=>{
    meta={w:v.videoWidth,h:v.videoHeight,d:v.duration};URL.revokeObjectURL(u);
    if(cutUrl)URL.revokeObjectURL(cutUrl);
    cut.src=cutUrl=URL.createObjectURL(file);$('trim').hidden=false;
    const akhir=Math.floor(meta.d*10)/10;
    $('start').max=$('end').max=akhir;$('start').value=0;$('end').value=akhir;gambar();
    check();
  };
  v.onerror=()=>say('Video tidak terbaca. Coba file MP4.');
  v.src=u;
};

async function blobURL(url,type){
  const r=await fetch(url);
  if(!r.ok)throw new Error('Gagal mengunduh mesin video. Cek internet.');
  return URL.createObjectURL(new Blob([await r.arrayBuffer()],{type}));
}

async function loadFF(){
  say('Mengunduh mesin video (sekitar 30 MB)…');
  const js='text/javascript';
  const worker=await blobURL(LIB+'814.ffmpeg.js',js);
  const coreURL=await blobURL(CORE+'ffmpeg-core.js',js);
  const wasmURL=await blobURL(CORE+'ffmpeg-core.wasm','application/wasm');
  const f=new FFmpegWASM.FFmpeg();
  f.on('log',({message})=>{
    const m=message.match(/time=(\d+):(\d+):([\d.]+)/);
    if(!m||!meta)return;
    const p=Math.min(1,(m[1]*3600+m[2]*60+ +m[3])/outDur);
    $('bar').value=p;say(`${label} ${Math.round(p*100)}%`);
  });
  // worker dari CDN harus dijalankan lewat blob agar tidak ditolak browser
  const Asli=window.Worker;
  window.Worker=function(){return new Asli(worker)};
  try{await f.load({coreURL,wasmURL})}finally{window.Worker=Asli}
  return f;
}

async function run(args){
  if(await ff.exec(args)!==0)throw new Error('Proses encode gagal. Coba mutu "Bagus" atau HD 720.');
}

$('go').onclick=async()=>{
  cut.pause();aud.pause();
  const lock=['go','file','res','preset','speed','smooth','start','end','music','mstart','amode'];lock.forEach(i=>$(i).disabled=true);
  $('prev').hidden=$('save').hidden=true;$('bar').hidden=false;$('bar').value=0;
  let wake;try{wake=await navigator.wakeLock.request('screen')}catch(e){}
  try{
    if(!ff)ff=await loadFF();
    say('Membaca video…');
    await ff.writeFile('in',new Uint8Array(await file.arrayBuffer()));
    const short=Math.min(meta.w,meta.h),long=Math.max(meta.w,meta.h),sel=$('res').value;
    const k=sel==='screen'?Math.min(sides[0]/short,sides[1]/long):Math.min(short,+sel)/short;
    const W=Math.round(meta.w*k/2)*2,H=Math.round(meta.h*k/2)*2;
    const sp=+$('speed').value,mode=$('smooth').value;a=+$('start').value,len=+$('end').value-a;outDur=len/sp;
    const lagu=$('music').files[0];
    if(lagu)await ff.writeFile('music',new Uint8Array(await lagu.arrayBuffer()));
    const gerak=sp<1&&mode!=='none'?`minterpolate=fps=30:mi_mode=${mode}`:'fps=30';
    const tempo=[];let r=sp;
    while(r>2){tempo.push('atempo=2');r/=2}
    while(r<0.5){tempo.push('atempo=0.5');r*=2}
    tempo.push('atempo='+r);
    const vf=`setpts=PTS/${sp},scale=${W}:${H}:flags=lanczos+accurate_rnd+full_chroma_int:out_color_matrix=bt709:out_range=tv,format=yuv420p,${gerak},setparams=color_primaries=bt709:color_trc=bt709:colorspace=bt709:range=tv`;
    let br=Math.floor(Math.min(8000,(TARGET*8/outDur-128000)/1000)),data;
    for(let t=0;t<3;t++){
      const input=['-y','-ss',String(a),'-t',String(len),'-i','in'];
      const base=['-vf',vf,'-c:v','libx264','-preset',$('preset').value,
        '-profile:v','high','-b:v',br+'k','-maxrate',Math.round(br*1.5)+'k','-bufsize',br*2+'k','-g','60','-passlogfile','log'];
      label='Tahap 1 dari 2 (analisis)';say(label);
      await run([...input,...base,'-pass','1','-an','-t',String(outDur),'-f','null','-']);
      label='Tahap 2 dari 2 (encode)';say(label);
      const akhir=['-c:a','aac','-b:a','128k','-t',String(outDur),'-movflags','+faststart','out.mp4'];
      const musik=['-stream_loop','-1','-ss',String(+$('mstart').value||0),'-i','music'];
      const ganti=()=>run([...input,...musik,...base,'-pass','2','-map','0:v:0','-map','1:a:0',...akhir]);
      if(!lagu)await run([...input,...base,'-pass','2','-af',tempo.join(','),...akhir]);
      else if($('amode').value==='ganti')await ganti();
      else try{
        await run([...input,...musik,...base,'-pass','2','-filter_complex',
          `[0:a]${tempo.join(',')}[s];[1:a]volume=0.6[m];[s][m]amix=inputs=2:duration=longest:normalize=0,alimiter=limit=0.95[a]`,
          '-map','0:v:0','-map','[a]',...akhir]);
      }catch(e){await ganti()} // video tanpa suara: pakai lagu saja
      data=await ff.readFile('out.mp4');
      if(data.length<=MAX)break;
      br=Math.floor(br*TARGET/data.length*0.95);
    }
    if(data.length>MAX)throw new Error('Ukuran masih di atas limit. Pakai video lebih pendek.');
    if(outUrl)URL.revokeObjectURL(outUrl);
    outUrl=URL.createObjectURL(new Blob([data],{type:'video/mp4'}));
    $('prev').src=$('save').href=outUrl;$('save').download=`status-hd-${Date.now()}.mp4`;
    $('prev').hidden=$('save').hidden=false;
    say(`Selesai: ${W}×${H}, ${(data.length/1e6).toFixed(1)} MB. Upload lewat WhatsApp Web.`);
  }catch(e){
    say('Gagal: '+(e.message||e));
    if(ff){ff.terminate();ff=null}
  }finally{lock.forEach(i=>$(i).disabled=false);$('bar').hidden=true;if(wake)wake.release().catch(()=>{})}
};
})();
</script>
</body>
</html>
